<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guests · Church Hospitality App</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="navbar-root"></div>

  <div class="page container">
    <div class="page-header">
      <h1>Guests</h1>
      <input type="text" id="searchInput" placeholder="Search by name, phone, or email…" style="max-width:280px;">
    </div>

    <div id="alertBox"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>Visit Date</th>
            <th>Pending</th>
            <th>Completed</th>
          </tr>
        </thead>
        <tbody id="guestsBody"></tbody>
      </table>
    </div>
    <div id="emptyState" class="empty-state hidden">No guests found yet.</div>
  </div>

  <div class="modal-backdrop hidden" id="detailModalBackdrop">
    <div class="modal wide" id="detailModal"></div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/guests.js"></script>
</body>
</html>
