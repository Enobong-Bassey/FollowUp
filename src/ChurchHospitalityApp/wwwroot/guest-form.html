<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome! · Guest Registration</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="page container" style="max-width:560px;">
    <div class="card" style="margin-top:24px;">
      <h1 style="text-align:center; color:var(--primary-dark);">⛪ We're glad you're here!</h1>
      <p class="text-muted" style="text-align:center;">
        Please share a few details so our Hospitality team can connect with you.
      </p>

      <div id="alertBox"></div>

      <form id="guestForm">
        <div class="form-group">
          <label for="fullName">Full Name *</label>
          <input type="text" id="fullName" required maxlength="150">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="phone">Phone Number *</label>
            <input type="tel" id="phone" required maxlength="30">
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" maxlength="200">
          </div>
        </div>
        <div class="form-group">
          <label for="gender">Gender</label>
          <select id="gender">
            <option value="">Prefer not to say</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>
        <div class="form-group">
          <label for="address">Address</label>
          <input type="text" id="address" maxlength="300">
        </div>
        <div class="form-group">
          <label for="howHeard">How did you hear about us?</label>
          <input type="text" id="howHeard" maxlength="300" placeholder="e.g. friend, social media, drove past">
        </div>
        <div class="form-group">
          <label for="notes">Anything you'd like us to know?</label>
          <textarea id="notes" maxlength="1000"></textarea>
        </div>
        <button type="submit" class="btn" style="width:100%;" id="submitBtn">Submit</button>
      </form>

      <div id="thankYou" class="hidden" style="text-align:center; padding: 30px 0;">
        <h2 style="color:var(--success);">Thank you! 🎉</h2>
        <p class="text-muted">We're so glad you joined us. Someone from our team will be in touch soon.</p>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const form = document.getElementById('guestForm');
    const alertBox = document.getElementById('alertBox');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.innerHTML = '';
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting…';

      try {
        await Api.post('/api/guests', {
          fullName: document.getElementById('fullName').value.trim(),
          phoneNumber: document.getElementById('phone').value.trim(),
          email: document.getElementById('email').value.trim() || null,
          gender: document.getElementById('gender').value || null,
          address: document.getElementById('address').value.trim() || null,
          howHeardAboutUs: document.getElementById('howHeard').value.trim() || null,
          notes: document.getElementById('notes').value.trim() || null
        });

        form.classList.add('hidden');
        document.getElementById('thankYou').classList.remove('hidden');
      } catch (err) {
        alertBox.innerHTML = `<div class="alert error">${Api.esc(err.message)}</div>`;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit';
      }
    });
  </script>
</body>
</html>
