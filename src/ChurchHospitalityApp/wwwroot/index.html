<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In · Church Hospitality App</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>⛪ Hospitality Unit</h1>
      <p class="subtitle">Log in to manage guests and follow-ups</p>

      <div id="alertBox"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn" style="width:100%;" id="loginBtn">Log In</button>
      </form>

      <p class="text-muted" style="text-align:center; margin-top:18px; font-size:0.85rem;">
        New members: use the link sent to your email to set up your account.
      </p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    // Already logged in? Skip straight to the dashboard.
    if (Api.getToken()) window.location.href = '/dashboard.html';

    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const loginBtn = document.getElementById('loginBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.innerHTML = '';
      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in…';

      try {
        const data = await Api.post('/api/auth/login', {
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value
        });

        Api.setSession(data.token, {
          userId: data.userId,
          fullName: data.fullName,
          email: data.email,
          role: data.role,
          profilePhotoUrl: data.profilePhotoUrl
        });

        window.location.href = '/dashboard.html';
      } catch (err) {
        alertBox.innerHTML = `<div class="alert error">${Api.esc(err.message)}</div>`;
        loginBtn.disabled = false;
        loginBtn.textContent = 'Log In';
      }
    });
  </script>
</body>
</html>
