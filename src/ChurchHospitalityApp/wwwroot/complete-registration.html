<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Registration · Church Hospitality App</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Welcome!</h1>
      <p class="subtitle">Confirm your details and set a password to finish setting up your account.</p>

      <div id="alertBox"></div>

      <form id="regForm">
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" required placeholder="e.g. +1 555 123 4567">
        </div>
        <div class="form-group">
          <label for="password">Create Password</label>
          <input type="password" id="password" required minlength="6" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" required minlength="6" autocomplete="new-password">
        </div>
        <button type="submit" class="btn" style="width:100%;" id="submitBtn">Complete Registration</button>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const userId = params.get('userId');
    const token = params.get('token');
    const alertBox = document.getElementById('alertBox');
    const form = document.getElementById('regForm');

    if (!userId || !token) {
      alertBox.innerHTML = '<div class="alert error">This link is invalid. Please use the link sent to your email.</div>';
      form.classList.add('hidden');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.innerHTML = '';

      const password = document.getElementById('password').value;
      if (password !== document.getElementById('confirmPassword').value) {
        alertBox.innerHTML = '<div class="alert error">Passwords do not match.</div>';
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting…';

      try {
        await Api.post('/api/auth/complete-registration', {
          userId, token, password,
          phoneNumber: document.getElementById('phone').value.trim()
        });

        alertBox.innerHTML = '<div class="alert success">Registration complete! Redirecting to login…</div>';
        form.classList.add('hidden');
        setTimeout(() => window.location.href = '/index.html', 1800);
      } catch (err) {
        alertBox.innerHTML = `<div class="alert error">${Api.esc(err.message)}</div>`;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Complete Registration';
      }
    });
  </script>
</body>
</html>
