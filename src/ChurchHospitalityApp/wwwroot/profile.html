<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile · Church Hospitality App</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="navbar-root"></div>

  <div class="page container" style="max-width:600px;">
    <div class="page-header"><h1>My Profile</h1></div>

    <div id="alertBox"></div>

    <div class="card">
      <div style="display:flex; align-items:center; gap:20px; margin-bottom:24px; flex-wrap:wrap;">
        <img id="avatarPreview" src="/img/default-avatar.svg" class="avatar-lg" alt="Profile photo">
        <div>
          <label class="btn secondary small" for="photoInput" style="cursor:pointer; margin:0;">Change Photo</label>
          <input type="file" id="photoInput" accept="image/png, image/jpeg, image/webp" class="hidden">
          <p class="text-muted" style="font-size:0.8rem; margin:6px 0 0;">JPG, PNG or WEBP. Max 5MB.</p>
        </div>
      </div>

      <form id="profileForm">
        <div class="form-group">
          <label for="email">Email (read-only)</label>
          <input type="email" id="email" disabled>
        </div>
        <div class="form-group">
          <label for="fullName">Full Name *</label>
          <input type="text" id="fullName" required maxlength="150">
        </div>
        <div class="form-group">
          <label for="phone">Phone Number *</label>
          <input type="tel" id="phone" required>
        </div>
        <button type="submit" class="btn" id="saveBtn">Save Changes</button>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
