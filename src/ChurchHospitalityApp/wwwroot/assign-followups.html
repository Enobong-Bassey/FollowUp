<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assign Follow-Ups · Church Hospitality App</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="navbar-root"></div>

  <div class="page container">
    <div class="page-header">
      <h1>Assign &amp; Track Follow-Ups</h1>
      <select id="viewFilter" style="width:auto;">
        <option value="unassigned">Unassigned</option>
        <option value="all">All Follow-Ups (accountability view)</option>
      </select>
    </div>

    <div id="alertBox"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Guest</th>
            <th>Phone</th>
            <th>Week</th>
            <th>Scheduled For</th>
            <th>Status</th>
            <th>Call Log</th>
            <th>Assigned To</th>
            <th>Assign</th>
          </tr>
        </thead>
        <tbody id="rowsBody"></tbody>
      </table>
    </div>
    <div id="emptyState" class="empty-state hidden">Nothing to show here.</div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/assign-followups.js"></script>
</body>
</html>
